# - push main：构建测试后资产滚动挂 pre-release tag `dev`（本地测试期的滚动升级源，`hst self update`）；
# - push v* tag：构建测试后资产挂正式 release（封版触发，`hst self update --stable`）。
# 资产名即编译目标（selfupdate 按目标三元组映射）；mac 只要 arm64 不要 intel（用户裁决）。
# D45 oma 遗产清扫：oma-<triple> 过渡 stub 资产与镜像 oma/ 兼容段退役（D29 定的
# 一个版本窗口已过）；镜像只保留 hst/ 主段。
name: dev-release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  docs-gate:
    # 三个 md 扫描进 CI（codex 验收 review 补：此前只在本地人工执行，
    # 标题括号类红两次溜过发布）。rumdl 需 Python 侧工具，走 uv。
    # aidoc 漂移门禁进 CI（codex 评审 O8 收口：v1.3.0 封版时 aidoc 存量
    # 漂移无人拦，本地 --check 绿过不了机器；ubuntu-latest 自带 Rust 工具链）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Markdown gates
        run: |
          uv run --script .tools/md-ref-scan.py
          uv run --script .tools/md-heading-scan.py
          uv run --script .tools/mdcharlint.py
          uvx rumdl check .
      - name: aidoc drift gate
        run: |
          # cargo-aidoc 钉 nightly-2026-07-07 跑 rustdoc（首弹红因：runner
          # 只有 stable，rustup run 找不到工具链）。
          rustup toolchain install nightly-2026-07-07 --profile minimal
          cargo install cargo-aidoc --locked
          cargo aidoc --check --strict

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # D47（2026-09-14 用户裁）：Windows 构建切 gnu 交叉编译摆脱 VC，
          # ubuntu 岗交叉出 PE（CRT 静态零 DLL 依赖，ohmycloud 侧已实证）。
          # Test 对交叉岗跳过：PE 不可在 linux 跑，测试面由 linux/mac 双岗覆盖。
          - os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install mingw-w64
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Test
        if: matrix.target != 'x86_64-pc-windows-gnu'
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bins
      - name: Package
        shell: bash
        run: |
          triple="${{ matrix.target }}"
          src="target/${triple}/release/hst"
          case "${triple}" in *-pc-windows-*) src="${src}.exe";; esac
          mkdir -p "dist/hst-${triple}"
          cp "$src" "dist/hst-${triple}/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "hst-${triple}.zip" "hst-${triple}" || zip -r "hst-${triple}.zip" "hst-${triple}"
          else
            tar czf "hst-${triple}.tar.gz" "hst-${triple}"
          fi
          sha256sum "hst-${triple}.${{ matrix.archive }}" > "hst-${triple}.${{ matrix.archive }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: hst-${{ matrix.target }}
          path: dist/*

  release:
    needs: [build, docs-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            gh release create "$tag" dist/*.zip dist/*.tar.gz dist/*.sha256 --latest \
              --title "hst $tag" \
              --notes "正式版 $tag（版本 tag 触发构建）。安装：hst self update --stable。"
          else
            gh release delete dev --yes --cleanup-tag || true
            gh release create dev dist/*.zip dist/*.tar.gz dist/*.sha256 --prerelease \
              --title "hst dev (rolling)" \
              --notes "滚动开发版：main 最新提交自动构建。安装：hst self update（默认 dev 通道）。"
          fi

  # D41 路线 A：产物镜像自推 R2（env 桶）——hst/ 主段 sync（dev 滚动与 stable
  # tag）。边车是 Package 步 sha256sum 原生格式（hex 空两格加名）。D45 起 oma/
  # 兼容段退役（stub 资产不再构建），ohmycloud 侧随后收段。
  mirror:
    needs: release
    runs-on: ubuntu-latest
    env:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      # 必带（D41 实证）：受限 token 无建桶权，预检 CreateBucket 会 403。
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Install rclone if missing
        run: command -v rclone || (curl -fsSL https://rclone.org/install.sh | sudo bash)
      - name: Mirror to R2
        run: |
          seg="dev"
          [[ "$GITHUB_REF" == refs/tags/v* ]] && seg="stable"
          mkdir -p dist-hst
          mv artifacts/hst-* dist-hst/ 2>/dev/null || true
          # 段内只留压缩包加边车；sync 加 --delete-excluded 清段内白名单外遗留
          #（D45 连带清掉 dist 里不再构建的 oma stub 残件，如仍混入）。
          rclone sync dist-hst/ "r2:${R2_BUCKET}/hst/${seg}/" \
            --include "*.zip" --include "*.tar.gz" --include "*.sha256" \
            --delete-excluded \
            --header-upload "Cache-Control: public, max-age=60" \
            --checksum -v --stats-one-line
          rclone lsl "r2:${R2_BUCKET}/hst/${seg}/"
