# ADR-0007（总台 build-release 标准对齐，2026-09-17 核准批 A）：编译与打包产地迁本地
# （.tools/release.ps1，wsl 交叉 linux 加 win-gnu、lan-mac 实机），正式版 gh 本地直发，
# CI 不再建正式 Release；本 workflow 面 = 测试岗（docs-gate）加 dev 轻岗（豁免在册：
# push main 建 dev prerelease 滚动源）加播种（从 Release 资产拉，stable 走 release
# published 事件，dev 轻岗链内触发——GITHUB_TOKEN 建档不触发 release 事件）。
# 资产名即编译目标（selfupdate 按目标三元组映射）；mac 只要 arm64 不要 intel（用户裁决）。
name: dev-release

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  docs-gate:
    # 三个 md 扫描进 CI（codex 验收 review 补：此前只在本地人工执行，
    # 标题括号类红两次溜过发布）。rumdl 需 Python 侧工具，走 uv。
    # aidoc 漂移门禁进 CI（codex 评审 O8 收口：v1.3.0 封版时 aidoc 存量
    # 漂移无人拦，本地 --check 绿过不了机器；ubuntu-latest 自带 Rust 工具链）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Markdown gates
        run: |
          uv run --script .tools/md-ref-scan.py
          uv run --script .tools/md-heading-scan.py
          uv run --script .tools/mdcharlint.py
          uvx rumdl check .
      - name: aidoc drift gate
        run: |
          # cargo-aidoc 钉 nightly-2026-07-07 跑 rustdoc（首弹红因：runner
          # 只有 stable，rustup run 找不到工具链）。
          rustup toolchain install nightly-2026-07-07 --profile minimal
          cargo install cargo-aidoc --locked
          cargo aidoc --check --strict

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # D47（2026-09-14 用户裁）：Windows 构建切 gnu 交叉编译摆脱 VC，
          # ubuntu 岗交叉出 PE（CRT 静态零 DLL 依赖，ohmycloud 侧已实证）。
          # Test 对交叉岗跳过：PE 不可在 linux 跑，测试面由 linux/mac 双岗覆盖。
          - os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install mingw-w64
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Test
        if: matrix.target != 'x86_64-pc-windows-gnu'
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bins
      - name: Package
        shell: bash
        run: |
          triple="${{ matrix.target }}"
          src="target/${triple}/release/hst"
          case "${triple}" in *-pc-windows-*) src="${src}.exe";; esac
          mkdir -p "dist/hst-${triple}"
          cp "$src" "dist/hst-${triple}/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "hst-${triple}.zip" "hst-${triple}" || zip -r "hst-${triple}.zip" "hst-${triple}"
          else
            tar czf "hst-${triple}.tar.gz" "hst-${triple}"
          fi
          sha256sum "hst-${triple}.${{ matrix.archive }}" > "hst-${triple}.${{ matrix.archive }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: hst-${{ matrix.target }}
          path: dist/*

  dev-release:
    # dev 轻岗（ADR-0007 豁免在册）：main 推滚动 prerelease；正式版归本地直发。
    if: github.event_name == 'push'
    needs: [build, docs-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev dist/*.zip dist/*.tar.gz dist/*.sha256 --prerelease \
            --title "hst dev (rolling)" \
            --notes "滚动开发版：main 最新提交自动构建。安装：hst self update（默认 dev 通道）。"

  # 播种（ADR-0007）：从 Release 资产拉（不再吃 workflow artifacts）；stable 走
  # release published 事件（本地直发触发），dev 轻岗链内触发（GITHUB_TOKEN 建档
  # 不触发 release 事件）。边车即镜像锚契约（sha256sum 原生格式）。
  seed:
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [dev-release]
    runs-on: ubuntu-latest
    env:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      # 必带（D41 实证）：受限 token 无建桶权，预检 CreateBucket 会 403。
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install rclone if missing
        run: command -v rclone || (curl -fsSL https://rclone.org/install.sh | sudo bash)
      - name: Pick release and download assets
        id: rel
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            seg="stable"
          else
            tag="dev"
            seg="dev"
          fi
          echo "seg=$seg" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'hst-*' --dir dist-hst
      - name: Seed mirror segment
        run: |
          seg="${{ steps.rel.outputs.seg }}"
          # 段内只留压缩包加边车；sync 加 --delete-excluded 清段内白名单外遗留。
          rclone sync dist-hst/ "r2:${R2_BUCKET}/hst/${seg}/" \
            --include "*.zip" --include "*.tar.gz" --include "*.sha256" \
            --delete-excluded \
            --header-upload "Cache-Control: public, max-age=60" \
            --checksum -v --stats-one-line
          rclone lsl "r2:${R2_BUCKET}/hst/${seg}/"
