[lints.rust]
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
empty_docs = "deny"
missing_safety_doc = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[package]
name = "hst-cli"
version = "2.8.0"
edition = "2021"
description = "HST（Hooks, Statusline, Trace）：Claude/Codex/Grok/Kimi 四家 hook 落盘、状态栏、只读 trace、doctor 与 yolo 部署配置工具"
license = "MIT"
repository = "https://github.com/raystyle/hst_rs"

[[bin]]
name = "hst"
path = "src/main.rs"

[lib]
name = "hst"

[dependencies]
# 密钥一钥两密文（S031，对齐 ohmycloud D20）：AES-256-GCM 包裹 age 身份用
# RustCrypto aes-gcm（主流稳定）；age 官方实现做身份解析与 recipient 派生
# （不自写 X25519）；getrandom 出 32B 应用密钥。vault 走 sops 二进制。
aes-gcm = "0.10"
age = "0.11"
base64 = "0.22"
ledger-client = { git = "https://github.com/raystyle/ledger-rs", tag = "v0.1.3" }
getrandom = "0.3"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dirs = "5"
flate2 = "1"
glob = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order：JSON 字段序与 kv 行序一致（issue #1 契约；ome S003 实证
# 教训——默认 BTreeMap 字母序会打乱）。
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tar = "0.4"
# RFC3339 解析（grok auth.json 的 expires_at/create_time；R005 选型：主流
# 稳定、只需 parsing feature，不自写日期解析）。
time = { version = "0.3", features = ["parsing"] }
toml = "0.8"
ureq = { version = "2", features = ["tls"] }
which = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
# assert_cmd 与 predicates 为 clap 官方生态标准 CLI 测试件（R005 选型：
# crates.io 稳定主流、持续维护），只进测试构建；serde_json 供集成测试解析
# --format 输出（同开 preserve_order 以断言字段序契约）。
assert_cmd = "2"
predicates = "3"
serde_json = { version = "1", features = ["preserve_order"] }
